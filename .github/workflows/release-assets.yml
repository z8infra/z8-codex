name: Release assets

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  windows-installer:
    name: Windows installer (${{ matrix.arch }})
    needs: source-compliance
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - arch: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install NSIS
        if: matrix.arch == 'x64'
        run: choco install nsis -y

      - name: Verify native runner and NSIS
        shell: pwsh
        run: |
          $expected = if ("${{ matrix.arch }}" -eq "arm64") { "Arm64" } else { "X64" }
          $actual = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()
          if ($actual -ne $expected) { throw "Expected $expected runner, got $actual" }
          $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path -LiteralPath $makensis) -and -not (Get-Command makensis.exe -ErrorAction SilentlyContinue)) {
            throw "NSIS compiler is not available"
          }

      - name: Install frontend dependencies
        working-directory: apps/codex-plus-manager
        run: npm ci

      - name: Build frontend
        working-directory: apps/codex-plus-manager
        run: npm run vite:build

      - name: Build binaries
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Verify native PE architecture
        shell: pwsh
        run: |
          ./scripts/installer/windows/verify-pe-machine.ps1 -Path "target/${{ matrix.target }}/release/codex-plus-plus.exe" -Arch "${{ matrix.arch }}"
          ./scripts/installer/windows/verify-pe-machine.ps1 -Path "target/${{ matrix.target }}/release/codex-plus-plus-manager.exe" -Arch "${{ matrix.arch }}"

      - name: Stage Windows app files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/windows/app | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/codex-plus-plus.exe" -Destination dist/windows/app/z8-codex.exe
          Copy-Item "target/${{ matrix.target }}/release/codex-plus-plus-manager.exe" -Destination dist/windows/app/z8-codex-manager.exe
          Copy-Item LICENSE dist/windows/app/

      - name: Build Windows zip asset
        shell: pwsh
        run: |
          $version = "${{ github.event.release.tag_name }}".TrimStart("v", "V")
          New-Item -ItemType Directory -Force dist/windows | Out-Null
          Compress-Archive -Path dist/windows/app/* -DestinationPath "dist/windows/Z8Codex-$version-windows-${{ matrix.arch }}.zip" -Force

      - name: Build Windows installer
        shell: pwsh
        run: |
          $version = "${{ github.event.release.tag_name }}".TrimStart("v", "V")
          $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) {
            $makensis = "makensis"
          }
          Push-Location scripts/installer/windows
          & $makensis "/INPUTCHARSET" "UTF8" "/DVERSION=$version" "/DARCH=${{ matrix.arch }}" CodexPlusPlus.nsi
          if ($LASTEXITCODE -ne 0) { throw "NSIS failed with exit code $LASTEXITCODE" }
          Pop-Location

      - name: Upload Windows installer
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            dist/windows/*.exe
            dist/windows/*.zip

  macos-dmg:
    name: macOS DMG (${{ matrix.arch }})
    needs: source-compliance
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - arch: arm64
            runner: macos-14
            target: aarch64-apple-darwin
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install frontend dependencies
        working-directory: apps/codex-plus-manager
        run: npm ci

      - name: Build frontend
        working-directory: apps/codex-plus-manager
        run: npm run vite:build

      - name: Build binaries
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Build macOS DMG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          VERSION="${VERSION#V}"
          MACOS_BUILD_NUMBER="$GITHUB_RUN_NUMBER" BINARY_DIR="$PWD/target/${{ matrix.target }}/release" bash scripts/installer/macos/package-dmg.sh "$VERSION" "${{ matrix.arch }}"

      - name: Verify macOS bundle structure
        run: |
          set -euo pipefail
          case "${{ matrix.arch }}" in
            x64) expected_arch=x86_64 ;;
            arm64) expected_arch=arm64 ;;
            *) echo "unsupported macOS architecture" >&2; exit 1 ;;
          esac
          test -L "dist/macos/stage/Applications"
          test "$(readlink "dist/macos/stage/Applications")" = "/Applications"
          for app in "dist/macos/stage/Z8 Codex.app" "dist/macos/stage/Z8 Codex 管理工具.app"; do
            test -f "$app/Contents/Info.plist"
            test -f "$app/Contents/PkgInfo"
            executable="$app/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")"
            test -x "$executable"
            test "$(lipo -archs "$executable")" = "$expected_arch"
            plutil -lint "$app/Contents/Info.plist" >/dev/null
            codesign --verify --deep --strict "$app"
            echo "verified: $app"
          done

      - name: Upload macOS DMG
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            dist/macos/*.dmg

  source-compliance:
    name: Publish corresponding source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Build source archive and license asset
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          VERSION="${VERSION#V}"
          test -n "$VERSION"
          test -f LICENSE
          mkdir -p dist/source
          PREFIX="Z8Codex-${VERSION}/"
          git archive --format=tar.gz --prefix="$PREFIX" "$TAG" > "dist/source/Z8Codex-${VERSION}-source.tar.gz"
          cp LICENSE "dist/source/Z8Codex-${VERSION}-LICENSE.txt"
          THIRD_PARTY_NOTICES_OUTPUT="dist/source/Z8Codex-${VERSION}-THIRD-PARTY-NOTICES.md" \
            python scripts/release/build-third-party-notices.py
          test -s "dist/source/Z8Codex-${VERSION}-source.tar.gz"
          test -s "dist/source/Z8Codex-${VERSION}-LICENSE.txt"
          test -s "dist/source/Z8Codex-${VERSION}-THIRD-PARTY-NOTICES.md"
          sha256sum dist/source/* | sort > "dist/source/Z8Codex-${VERSION}-source.SHA256SUMS"

      - name: Upload source and license assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            dist/source/*.tar.gz
            dist/source/*-LICENSE.txt
            dist/source/*-THIRD-PARTY-NOTICES.md
            dist/source/*.SHA256SUMS

  latest-json:
    name: Upload static latest.json
    runs-on: ubuntu-latest
    needs:
      - windows-installer
      - macos-dmg
      - source-compliance
    steps:
      - name: Generate latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$REPO" --json assets,body,tagName,url > release.json
          node <<'NODE'
          const fs = require("fs");
          const release = JSON.parse(fs.readFileSync("release.json", "utf8"));
          const repo = process.env.REPO;
          const tag = release.tagName || process.env.TAG;
          const version = tag.replace(/^v/i, "");
          const baseUrl = `https://github.com/${repo}/releases/download/${tag}`;
          const assets = (release.assets || [])
            .map((asset) => asset.name)
            .filter((name) => name !== "latest.json")
            .map((name) => ({ name, url: `${baseUrl}/${encodeURIComponent(name)}` }));
          const payload = {
            version: `v${version}`,
            url: release.url || `https://github.com/${repo}/releases/tag/${tag}`,
            body: release.body || "",
            assets
          };
          fs.writeFileSync("latest.json", `${JSON.stringify(payload, null, 2)}\n`);
          NODE
          cat latest.json

      - name: Upload latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        shell: bash
        run: gh release upload "$TAG" latest.json --clobber --repo "$REPO"
