name: Release assets

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to build, for example v1.3.3"
        required: true
        type: string

permissions:
  contents: write

jobs:
  prepare-release:
    name: Create release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Resolve release tag
        id: release
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$REF_TYPE" == "tag" ]]; then
            requested_tag="$REF_NAME"
          elif [[ -n "$INPUT_TAG" ]]; then
            requested_tag="$INPUT_TAG"
          else
            requested_tag=""
          fi
          if [[ -n "$requested_tag" && ! "$requested_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use vX.Y.Z, got: $requested_tag" >&2
            exit 1
          fi
          echo "requested_tag=$requested_tag" >> "$GITHUB_OUTPUT"

      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.sha }}
          fetch-depth: 0

      - name: Verify release version
        id: version
        shell: bash
        env:
          REQUESTED_TAG: ${{ steps.release.outputs.requested_tag }}
          IS_BRANCH_PUSH: ${{ github.event_name == 'push' && github.ref_type == 'branch' }}
        run: |
          set -euo pipefail
          workspace_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          manager_version="$(node -p "require('./apps/codex-plus-manager/package.json').version")"
          tauri_version="$(node -p "require('./apps/codex-plus-manager/src-tauri/tauri.conf.json').version")"
          if [[ -n "$REQUESTED_TAG" ]]; then
            tag="$REQUESTED_TAG"
            tag_version="${tag#v}"
          else
            tag="v$workspace_version"
            tag_version="$workspace_version"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Cargo workspace version must be X.Y.Z, got: $workspace_version" >&2
            exit 1
          fi
          for value in "$workspace_version" "$manager_version" "$tauri_version"; do
            if [[ "$value" != "$tag_version" ]]; then
              echo "Version mismatch: tag=$tag_version workspace=$workspace_version manager=$manager_version tauri=$tauri_version" >&2
              exit 1
            fi
          done
          echo "Validated release version $tag_version across Cargo, Manager, and Tauri."
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Generate Chinese release notes
        id: notes
        env:
          TAG: ${{ steps.version.outputs.tag }}
          REPO: ${{ github.repository }}
          NOTES_FILE: ${{ runner.temp }}/z8-codex-release-notes.md
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release/generate-release-notes.mjs \
            --tag "$TAG" \
            --repo "$REPO" \
            --output "$NOTES_FILE"
          echo "notes_file=$NOTES_FILE" >> "$GITHUB_OUTPUT"
          echo "--- release notes ---"
          cat "$NOTES_FILE"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          REPO: ${{ github.repository }}
          NOTES_FILE: ${{ steps.notes.outputs.notes_file }}
          IS_BRANCH_PUSH: ${{ github.event_name == 'push' && github.ref_type == 'branch' }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            if [[ "$IS_BRANCH_PUSH" == "true" ]]; then
              echo "Release $TAG already exists. Increment the shared Cargo, Manager, and Tauri versions before pushing another release." >&2
              exit 1
            fi
            echo "Release $TAG already exists; continuing to upload assets."
          else
            target="$GITHUB_SHA"
            if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
              target="$(git rev-list -n 1 "$TAG")"
            fi
            gh release create "$TAG" \
              --repo "$REPO" \
              --target "$target" \
              --title "Z8 Codex $TAG" \
              --draft \
              --notes-file "$NOTES_FILE"
          fi

      - name: Verify release is draft before asset uploads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          is_draft="$(gh release view "$TAG" --repo "$REPO" --json isDraft --jq '.isDraft')"
          if [[ "$is_draft" != "true" ]]; then
            echo "Release $TAG is already public; refusing to upload an incomplete asset set." >&2
            exit 1
          fi

  windows-installer:
    name: Windows installer (${{ matrix.arch }})
    needs: prepare-release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.tag }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install NSIS
        if: matrix.arch == 'x64'
        run: choco install nsis -y

      - name: Verify native runner and NSIS
        shell: pwsh
        run: |
          $expected = "X64"
          $actual = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()
          if ($actual -ne $expected) { throw "Expected $expected runner, got $actual" }
          $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path -LiteralPath $makensis) -and -not (Get-Command makensis.exe -ErrorAction SilentlyContinue)) {
            throw "NSIS compiler is not available"
          }

      - name: Install frontend dependencies
        working-directory: apps/codex-plus-manager
        run: npm ci

      - name: Build frontend
        working-directory: apps/codex-plus-manager
        run: npm run vite:build

      - name: Build binaries
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Verify native PE architecture
        shell: pwsh
        run: |
          ./scripts/installer/windows/verify-pe-machine.ps1 -Path "target/${{ matrix.target }}/release/codex-plus-plus.exe" -Arch "${{ matrix.arch }}"
          ./scripts/installer/windows/verify-pe-machine.ps1 -Path "target/${{ matrix.target }}/release/codex-plus-plus-manager.exe" -Arch "${{ matrix.arch }}"

      - name: Stage Windows app files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/windows/app | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/codex-plus-plus.exe" -Destination dist/windows/app/z8-codex.exe
          Copy-Item "target/${{ matrix.target }}/release/codex-plus-plus-manager.exe" -Destination dist/windows/app/z8-codex-manager.exe
          Copy-Item LICENSE dist/windows/app/

      - name: Build Windows zip asset
        shell: pwsh
        run: |
          $version = "${{ needs.prepare-release.outputs.tag }}".TrimStart("v", "V")
          New-Item -ItemType Directory -Force dist/windows | Out-Null
          Compress-Archive -Path dist/windows/app/* -DestinationPath "dist/windows/Z8Codex-$version-windows-${{ matrix.arch }}.zip" -Force

      - name: Build Windows installer
        shell: pwsh
        run: |
          $version = "${{ needs.prepare-release.outputs.tag }}".TrimStart("v", "V")
          $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) {
            $makensis = "makensis"
          }
          Push-Location scripts/installer/windows
          & $makensis "/INPUTCHARSET" "UTF8" "/DVERSION=$version" "/DARCH=${{ matrix.arch }}" CodexPlusPlus.nsi
          if ($LASTEXITCODE -ne 0) { throw "NSIS failed with exit code $LASTEXITCODE" }
          Pop-Location

      - name: Upload Windows installer
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag }}
          draft: true
          fail_on_unmatched_files: true
          files: |
            dist/windows/*.exe
            dist/windows/*.zip

  macos-dmg:
    name: macOS DMG (${{ matrix.arch }})
    needs: prepare-release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - arch: arm64
            runner: macos-14
            target: aarch64-apple-darwin
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.tag }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install frontend dependencies
        working-directory: apps/codex-plus-manager
        run: npm ci

      - name: Build frontend
        working-directory: apps/codex-plus-manager
        run: npm run vite:build

      - name: Build binaries
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Build macOS DMG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          VERSION="${VERSION#V}"
          MACOS_BUILD_NUMBER="$GITHUB_RUN_NUMBER" BINARY_DIR="$PWD/target/${{ matrix.target }}/release" bash scripts/installer/macos/package-dmg.sh "$VERSION" "${{ matrix.arch }}"

      - name: Verify macOS bundle structure
        run: |
          set -euo pipefail
          case "${{ matrix.arch }}" in
            x64) expected_arch=x86_64 ;;
            arm64) expected_arch=arm64 ;;
            *) echo "unsupported macOS architecture" >&2; exit 1 ;;
          esac
          test -L "dist/macos/stage/Applications"
          test "$(readlink "dist/macos/stage/Applications")" = "/Applications"
          for app in "dist/macos/stage/Z8 Codex.app" "dist/macos/stage/Z8 Codex 管理工具.app"; do
            test -f "$app/Contents/Info.plist"
            test -f "$app/Contents/PkgInfo"
            executable="$app/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")"
            test -x "$executable"
            test "$(lipo -archs "$executable")" = "$expected_arch"
            plutil -lint "$app/Contents/Info.plist" >/dev/null
            codesign --verify --deep --strict "$app"
            echo "verified: $app"
          done

      - name: Build macOS zip asset
        run: |
          set -euo pipefail
          VERSION="${{ needs.prepare-release.outputs.tag }}"
          VERSION="${VERSION#v}"
          VERSION="${VERSION#V}"
          ZIP_ROOT="$RUNNER_TEMP/Z8Codex-${VERSION}-macos-${{ matrix.arch }}"
          rm -rf "$ZIP_ROOT"
          mkdir -p "$ZIP_ROOT"
          cp -R "dist/macos/stage/Z8 Codex.app" "$ZIP_ROOT/"
          cp -R "dist/macos/stage/Z8 Codex 管理工具.app" "$ZIP_ROOT/"
          ln -s /Applications "$ZIP_ROOT/Applications"
          ditto -c -k --sequesterRsrc --keepParent "$ZIP_ROOT" "dist/macos/Z8Codex-${VERSION}-macos-${{ matrix.arch }}.zip"

      - name: Upload macOS packages
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag }}
          draft: true
          fail_on_unmatched_files: true
          files: |
            dist/macos/*.dmg
            dist/macos/*.zip

  latest-json:
    name: Upload static latest.json
    runs-on: ubuntu-latest
    needs:
      - prepare-release
      - windows-installer
      - macos-dmg
    steps:
      - name: Generate latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$REPO" --json assets,body,tagName,url > release.json
          node <<'NODE'
          const fs = require("fs");
          const release = JSON.parse(fs.readFileSync("release.json", "utf8"));
          const repo = process.env.REPO;
          const tag = release.tagName || process.env.TAG;
          const version = tag.replace(/^v/i, "");
          const baseUrl = `https://github.com/${repo}/releases/download/${tag}`;
          const assets = (release.assets || [])
            .map((asset) => asset.name)
            .filter((name) => name !== "latest.json")
            .map((name) => ({ name, url: `${baseUrl}/${encodeURIComponent(name)}` }));
          const requiredAssets = [
            /-windows-x64-setup\.exe$/i,
            /-windows-x64\.zip$/i,
            /-macos-x64\.dmg$/i,
            /-macos-x64\.zip$/i,
            /-macos-arm64\.dmg$/i,
            /-macos-arm64\.zip$/i
          ];
          for (const pattern of requiredAssets) {
            if (!assets.some((asset) => pattern.test(asset.name))) {
              throw new Error(`Release ${tag} is missing a required platform asset matching ${pattern}`);
            }
          }
          const payload = {
            version: `v${version}`,
            // Draft releases expose an untagged URL; the public tag URL is
            // stable and remains valid after the final draft-to-public edit.
            url: `https://github.com/${repo}/releases/tag/${tag}`,
            body: release.body || "",
            assets
          };
          fs.writeFileSync("latest.json", `${JSON.stringify(payload, null, 2)}\n`);
          NODE
          cat latest.json

      - name: Upload latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$TAG" latest.json --clobber --repo "$REPO"
          gh release edit "$TAG" --draft=false --latest --repo "$REPO"
