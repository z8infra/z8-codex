name: Z8 Codex PR build artifacts

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-artifacts:
    name: Windows artifacts (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - arch: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install NSIS
        if: matrix.arch == 'x64'
        run: choco install nsis -y

      - name: Verify native runner and NSIS
        shell: pwsh
        run: |
          $expected = if ("${{ matrix.arch }}" -eq "arm64") { "Arm64" } else { "X64" }
          $actual = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()
          if ($actual -ne $expected) { throw "Expected $expected runner, got $actual" }
          $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path -LiteralPath $makensis) -and -not (Get-Command makensis.exe -ErrorAction SilentlyContinue)) {
            throw "NSIS compiler is not available"
          }

      - name: Install frontend dependencies
        working-directory: apps/codex-plus-manager
        run: npm ci

      - name: Frontend tests
        working-directory: apps/codex-plus-manager
        run: npm test

      - name: TypeScript check
        working-directory: apps/codex-plus-manager
        run: npm run check

      - name: Build frontend
        working-directory: apps/codex-plus-manager
        run: npm run vite:build

      - name: Rust tests
        run: cargo test --workspace --locked --target ${{ matrix.target }}

      - name: Build release binaries
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Verify native PE architecture
        shell: pwsh
        run: |
          ./scripts/installer/windows/verify-pe-machine.ps1 -Path "target/${{ matrix.target }}/release/codex-plus-plus.exe" -Arch "${{ matrix.arch }}"
          ./scripts/installer/windows/verify-pe-machine.ps1 -Path "target/${{ matrix.target }}/release/codex-plus-plus-manager.exe" -Arch "${{ matrix.arch }}"

      - name: Stage Windows app files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/windows/app | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/codex-plus-plus.exe" -Destination dist/windows/app/z8-codex.exe
          Copy-Item "target/${{ matrix.target }}/release/codex-plus-plus-manager.exe" -Destination dist/windows/app/z8-codex-manager.exe

      - name: Build Windows installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v", "V")
          $version = $version -replace '[\\/]', '-'
          if (-not $version -or $version -eq "main") {
            $version = "0.0.0-${{ github.run_number }}"
          }
          $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) {
            $makensis = "makensis"
          }
          Push-Location scripts/installer/windows
          & $makensis "/INPUTCHARSET" "UTF8" "/DVERSION=$version" "/DARCH=${{ matrix.arch }}" CodexPlusPlus.nsi
          if ($LASTEXITCODE -ne 0) { throw "NSIS failed with exit code $LASTEXITCODE" }
          Pop-Location

      - name: Upload Windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: Z8Codex-windows-${{ matrix.arch }}-binaries
          path: dist/windows/app/*
          if-no-files-found: error

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Z8Codex-windows-${{ matrix.arch }}-installer
          path: dist/windows/*.exe
          if-no-files-found: error

  macos-dmg:
    name: macOS DMG (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - arch: arm64
            runner: macos-14
            target: aarch64-apple-darwin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install frontend dependencies
        working-directory: apps/codex-plus-manager
        run: npm ci

      - name: Build frontend
        working-directory: apps/codex-plus-manager
        run: npm run vite:build

      - name: Build release binaries
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Build macOS DMG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          VERSION="${VERSION#V}"
          VERSION="${VERSION//\//-}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then
            VERSION="0.0.0-${GITHUB_RUN_NUMBER}"
          fi
          MACOS_BUILD_NUMBER="$GITHUB_RUN_NUMBER" BINARY_DIR="$PWD/target/${{ matrix.target }}/release" bash scripts/installer/macos/package-dmg.sh "$VERSION" "${{ matrix.arch }}"

      - name: Verify macOS bundle structure
        run: |
          set -euo pipefail
          case "${{ matrix.arch }}" in
            x64) expected_arch=x86_64 ;;
            arm64) expected_arch=arm64 ;;
            *) echo "unsupported macOS architecture" >&2; exit 1 ;;
          esac
          test -L "dist/macos/stage/Applications"
          test "$(readlink "dist/macos/stage/Applications")" = "/Applications"
          for app in "dist/macos/stage/Z8 Codex.app" "dist/macos/stage/Z8 Codex 管理工具.app"; do
            test -f "$app/Contents/Info.plist"
            test -f "$app/Contents/PkgInfo"
            executable="$app/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")"
            test -x "$executable"
            test "$(lipo -archs "$executable")" = "$expected_arch"
            plutil -lint "$app/Contents/Info.plist" >/dev/null
            codesign --verify --deep --strict "$app"
            echo "verified: $app"
          done

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: Z8Codex-macos-${{ matrix.arch }}-dmg
          path: dist/macos/*.dmg
          if-no-files-found: error
